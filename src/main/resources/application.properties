spring.application.name=SampleEnterpriseProj1

# Amazon RDS MySQL configuration
spring.datasource.url=${RDS_URL:jdbc:mysql://your-rds-endpoint.region.rds.amazonaws.com:3306/sampledb?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${RDS_USERNAME:admin}
spring.datasource.password=${RDS_PASSWORD:your-rds-password}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
