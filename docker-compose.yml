services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 10

  cockroach-init:
    image: cockroachdb/cockroach:v24.1.0
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: >
      /cockroach/cockroach sql --insecure --host=cockroachdb:26257 -e "CREATE DATABASE IF NOT EXISTS sampledb;"
    restart: "no"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://cockroachdb:26257/sampledb?sslmode=disable
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD:
    depends_on:
      cockroach-init:
        condition: service_completed_successfully

volumes:
  cockroach-data:
